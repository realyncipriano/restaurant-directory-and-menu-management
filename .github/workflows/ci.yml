name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Next.js types
        run: npx next typegen

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Database schema tests (PGlite)
        run: npm run test:db

      - name: Production build
        run: npm run build

      # Report-only while the dependency baseline is reviewed.
      # Do not add `npm audit fix` or dependency upgrades here.
      - name: Dependency audit (report-only)
        if: always()
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
